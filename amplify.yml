version: 1
backend:
  phases:
    preBuild:
      commands:
        # Match .nvmrc / package.json engines (Node 26); the Amplify image ships nvm.
        # Node 26's binary links libatomic.so.1, which Amazon Linux 2023 lacks
        # (node exits 127); the build user isn't root, hence sudo.
        - sudo dnf install -y libatomic
        - nvm install 26 && nvm use 26
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        # Match .nvmrc / package.json engines (Node 26); the Amplify image ships nvm.
        # Node 26's binary links libatomic.so.1, which Amazon Linux 2023 lacks
        # (node exits 127); the build user isn't root, hence sudo.
        - sudo dnf install -y libatomic
        - nvm install 26 && nvm use 26
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    # The default '**/*' glob skips hidden dot-directories, which drops
    # dist/.well-known/ from the deploy — breaking Apple Passwords domain
    # association (the AASA file 404/301s at the edge). List it explicitly.
    files:
      - '**/*'
      - '.well-known/**/*'
  cache:
    paths:
      - .npm/**/*
