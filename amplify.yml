version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    # The default '**/*' glob skips hidden dot-directories, which drops
    # dist/.well-known/ from the deploy — breaking Apple Passwords domain
    # association (the AASA file 404/301s at the edge). List it explicitly.
    files:
      - '**/*'
      - '.well-known/**/*'
  cache:
    paths:
      - .npm/**/*
