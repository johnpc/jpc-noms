name: iOS Deploy

# Shared deploy (johnpc/ci-workflows): build the web app on the prod backend, sync it
# into Capacitor iOS, prove the real binary launches in a fresh simulator, then sign
# from the Mac mini CI keychain, archive, upload to App Store Connect and hand the
# build to external TestFlight testers. Never submits for App Store review.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: johnpc/ci-workflows/.github/workflows/ios-deploy-capacitor.yml@v1
    # inherit passes DEPLOY_PAT: the version-bump PR it opens is authored by johnpc, so
    # its CI runs on its own and auto-merge completes against the required checks
    # (a GITHUB_TOKEN PR starts no workflows). Hence no ci-workflow dispatch here.
    secrets: inherit
    with:
      bundle-id: com.johncorser.eats
      archive-name: Noms
      ref: main
      config-command: npm run prod-config
      # Google ML Kit ships no arm64 simulator slice and Xcode 27 has no Rosetta
      # simulators: build the smoke from a scratch copy without the scanner pod.
      smoke-remove-pods: CapacitorMlkitBarcodeScanning
      external-beta: true
      bump: patch
